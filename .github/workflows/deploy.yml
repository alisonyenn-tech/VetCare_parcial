
name: Publicar VetCare
 
on:
  push:
    branches:
      - main
  workflow_dispatch:
 
permissions:
  contents: read
  pages: write
  id-token: write
 
jobs:
  build:
    runs-on: ubuntu-latest
 
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4
 
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
 
      - name: Instalar dependencias
        run: npm ci
 
      - name: Compilar Angular
        run: npx ng build --configuration production --base-href /VetCare/
 
      - name: Crear página 404
        run: cp dist/veterinaria-app/browser/index.html dist/veterinaria-app/browser/404.html
 
      - name: Configurar Pages
        uses: actions/configure-pages@v5
 
      - name: Subir archivos
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/veterinaria-app/browser
 
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
 
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
